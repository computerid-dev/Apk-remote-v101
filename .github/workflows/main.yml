name: Build APK

# Workflow ini build APK debug tanpa perlu Android Studio / gradlew lokal.
# Jalan otomatis kalau ada push ke branch main, atau bisa dipicu manual
# lewat tab "Actions" -> pilih workflow ini -> "Run workflow".
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install paket Android SDK yang dibutuhkan
        # Runner ubuntu-latest sudah punya Android SDK bawaan (ANDROID_HOME
        # sudah di-set otomatis), jadi tidak perlu action pihak ketiga.
        # Kita hanya perlu memastikan platform & build-tools yang dipakai
        # proyek ini (API 35) sudah ter-install dan lisensinya diterima.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Repo ini tidak menyertakan gradlew/gradle-wrapper.jar, jadi
          # Gradle-nya di-install langsung oleh action ini.
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteBT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
